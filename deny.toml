# cargo-deny licence policy (run `cargo deny check licenses`; not yet in CI).
# GuideRecorder is MIT-licensed: permissive dependencies only. MPL-2.0 is allowed
# solely because Tauri pulls it in (cssparser, selectors, dtoa-short,
# option-ext); it is file-level copyleft and we do not modify those files.
[licenses]
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unlicense",
    "CC0-1.0", "BSL-1.0", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# Only reachable through Tauri; keep MPL out of our own crates.
allow = ["MPL-2.0"]
crate = "cssparser"
