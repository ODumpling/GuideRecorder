[package]
name = "guiderecorder-capture"
description = "GuideRecorder platform capture backends (macOS now, Windows later)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
guiderecorder-core.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Renders text for the text recognition tests; core uses the same version.
resvg = "0.48.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
# Narration: the microphone grant only.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "AVCaptureDevice",
    "AVMediaFormat",
] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFile",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioNode",
    "AVAudioSettings",
    "AVAudioTime",
    "AVAudioTypes",
] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-speech = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-avf-audio",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognitionTaskHint",
    "SFSpeechRecognizer",
    "SFTranscription",
    "SFTranscriptionSegment",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Authorization_AppCapabilityAccess",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Speech",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` (narration's audio stream) names this crate directly.
windows-core = "0.62"
