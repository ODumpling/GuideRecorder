[package]
name = "guiderecorder-mcp"
description = "Stdio MCP server over a GuideRecorder library, read-only unless --writable"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
guiderecorder-core.workspace = true
rmcp = { version = "3.0.0-beta.1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
