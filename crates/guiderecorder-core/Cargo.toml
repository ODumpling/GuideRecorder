[package]
name = "guiderecorder-core"
description = "GuideRecorder guide format, library, index, step detection, export and AI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
ulid = { version = "1", features = ["serde"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
resvg = "0.48.1"
svgtypes = "0.16.1"
minijinja = "3.0.0"
sha2 = "0.10.9"
docx-rs = "0.4.22"
typst = "0.15.1"
typst-pdf = "0.15.1"
# Low-resolution page images for the Export dialog's preview (`export/pdf.rs`).
typst-render = "0.15.1"
# Names the compiled document type (`export/pdf.rs`); typst uses the same version.
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
# PPTX packages (`export/pptx.rs`); docx-rs uses the same version.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# The editor lock's liveness check (`edit.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# MP4 export with AVFoundation (`export/motion/mp4.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVMediaFormat",
    "AVVideoSettings",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSURL",
    "NSValue",
] }

# MP4 export with Media Foundation (`export/motion/mp4.rs`); tauri uses the
# same version.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
lopdf = "0.45.0"
# Checks that PPTX parts are well-formed XML.
roxmltree = "0.21.1"
