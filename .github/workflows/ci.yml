name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    # The capture crate is macOS-only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Versions agree
        run: scripts/version.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests that need TCC permissions or the login Keychain are #[ignore]d.
      - run: cargo test --workspace --locked

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  frontend:
    name: Frontend (unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: app/e2e/test-results
          retention-days: 7

  web:
    name: Web (guide schema, sync, typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # guide.schema.json comes from the Rust model (checked by the rust job);
      # the TypeScript generated from it must be current too.
      - name: Generated guide types are current
        run: pnpm --filter @guiderecorder/guide-schema generate && git diff --exit-code packages/guide-schema
      - run: pnpm --filter @guiderecorder/guide-schema typecheck
      - run: pnpm --filter @guiderecorder/guide-schema test
      - run: pnpm --filter @guiderecorder/sync typecheck
      - run: pnpm --filter @guiderecorder/sync test
      - run: pnpm --filter @guiderecorder/web typecheck
      - run: pnpm --filter @guiderecorder/web test
      - run: pnpm --filter @guiderecorder/web build
