name: CI

# PRs and pushes to main run only the jobs whose files changed (see the
# `changes` job). Everything runs nightly, on manual dispatch, and before a
# release (release.yml calls this workflow with `full: true`).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:00 UTC (GitHub cron is UTC-only): 4am GMT, 5am BST.
    - cron: "0 4 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job regardless of what changed
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # Full debug info (PDBs on Windows) is most of the link time and the
  # target dir's size; line tables still give file:line in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.full.outputs.all || steps.filter.outputs.rust }}
      licenses: ${{ steps.full.outputs.all || steps.filter.outputs.licenses }}
      frontend: ${{ steps.full.outputs.all || steps.filter.outputs.frontend }}
      web: ${{ steps.full.outputs.all || steps.filter.outputs.web }}
      mobile: ${{ steps.full.outputs.all || steps.filter.outputs.mobile }}
    steps:
      - name: Full run?
        id: full
        if: inputs.full || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.full.outcome == 'skipped'
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.full.outcome == 'skipped'
        with:
          # A change to this workflow runs everything.
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            rust:
              - *ci
              - crates/**
              - app/src-tauri/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - fixtures/**
              - packages/guide-schema/guide.schema.json
              # scripts/version.sh compares these.
              - scripts/version.sh
              - app/package.json
            licenses:
              - *ci
              - deny.toml
              - Cargo.lock
              - "**/Cargo.toml"
            frontend:
              - *ci
              - app/**
              - packages/**
              - fixtures/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            web:
              - *ci
              - web/**
              - packages/**
              - fixtures/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            mobile:
              - *ci
              - mobile/**
              - packages/guide-schema/**
              - packages/sync/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # The capture crate is macOS-only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # PR caches can't be restored by other PRs, and at ~1.5 GB each
          # they evict main's from the 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Versions agree
        run: scripts/version.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests that need TCC permissions or the login Keychain are #[ignore]d.
      - run: cargo test --workspace --locked

  rust-windows:
    name: Rust on Windows (clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Capture is stubbed on Windows for now (#14); everything else builds
    # and is tested. Formatting is checked by the macOS job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Builds on a ReFS Dev Drive, which Defender scans less eagerly than
      # C:, with the repo, toolchain and cargo registry all copied onto it.
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 20GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      - name: Install Rust (rust-toolchain.toml)
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - run: cargo test --workspace --locked
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

  licenses:
    name: Dependency licences
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  frontend:
    name: Frontend (unit, build, e2e)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: app/e2e/test-results
          retention-days: 7

  web:
    name: Web (guide schema, sync, ui, typecheck, unit, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # guide.schema.json comes from the Rust model (checked by the rust job);
      # the TypeScript generated from it must be current too.
      - name: Generated guide types are current
        run: pnpm --filter @guiderecorder/guide-schema generate && git diff --exit-code packages/guide-schema
      - run: pnpm --filter @guiderecorder/guide-schema typecheck
      - run: pnpm --filter @guiderecorder/guide-schema test
      - run: pnpm --filter @guiderecorder/sync typecheck
      - run: pnpm --filter @guiderecorder/sync test
      - run: pnpm --filter @guiderecorder/ui typecheck
      - run: pnpm --filter @guiderecorder/ui test
      - run: pnpm --filter @guiderecorder/web typecheck
      - run: pnpm --filter @guiderecorder/web test
      - run: pnpm --filter @guiderecorder/web build

  mobile:
    name: Mobile (typecheck, unit, iOS bundle)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @guiderecorder/mobile typecheck
      - run: pnpm --filter @guiderecorder/mobile test
      # Metro bundles the app as a release build would, without Xcode.
      - run: pnpm --filter @guiderecorder/mobile exec expo export --platform ios --output-dir dist
        env:
          CI: "1"
