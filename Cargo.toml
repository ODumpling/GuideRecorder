[workspace]
resolver = "2"
members = [
    "crates/guiderecorder-core",
    "crates/guiderecorder-capture",
    "crates/guiderecorder-mcp",
    "crates/guiderecorder-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
guiderecorder-core = { path = "crates/guiderecorder-core" }
guiderecorder-capture = { path = "crates/guiderecorder-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
