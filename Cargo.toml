[workspace]
resolver = "2"
members = [
    "crates/guidesya-core",
    "crates/guidesya-capture",
    "crates/guidesya-mcp",
    "crates/guidesya-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
guidesya-core = { path = "crates/guidesya-core" }
guidesya-capture = { path = "crates/guidesya-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
