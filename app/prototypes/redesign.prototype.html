function editor(){return `<div class="body"><aside class="sidebar"><button class="back" data-action="library">${icon('back')} All guides</button><h3>Share a calendar event</h3><p class="guide-meta">5 steps &nbsp;·&nbsp; 2 min read</p><div class="eyebrow" style="margin-left:7px">Guide outline</div><div class="section-label">GETTING STARTED</div><div class="outline">${stepButtons()}</div><button class="add" data-action="add">+ &nbsp; Add a step</button><div class="local">${icon('shield')} Only stored on this Mac</div></aside><main class="workspace"><div class="breadcrumb"><button data-action="library">My library</button>${icon('chevron')}<span>Share a calendar event</span><span style="margin-left:auto">${String(selected+1).padStart(2,'0')} / 05</span></div><div class="heading"><div><div class="eyebrow">${variant==='B'?'THE EDITING ROOM':variant==='C'?'A LITTLE GUIDE TO':'MAKE THE EVERYDAY, REPEATABLE'}</div><h1>Share a calendar event</h1><p>Invite a colleague to an existing Calendar event.</p></div><button class="btn" data-action="preview">${preview?'Edit guide':'Preview'} ${icon('next')}</button></div><div class="editor"><div class="editor-top"><span class="muted">${preview?'READER VIEW':variant==='C'?'STEP '+String(selected+1).padStart(2,'0'):'Screenshot'} <span style="opacity:.45;margin-left:6px">${preview?'':'· Calendar'}</span></span><div class="tools ${preview?'hide':''}" role="toolbar" aria-label="Screenshot tools">${['cursor','arrow','box','blur'].map(n=>`<button class="tool ${tool===n?'selected':''}" data-tool="${n}" aria-label="${{cursor:'Select',arrow:'Arrow annotation',box:'Box annotation',blur:'Blur sensitive text'}[n]}" title="${{cursor:'Select',arrow:'Arrow',box:'Box',blur:'Blur'}[n]}">${icon(n)}</button>`).join('')}<div class="divider"></div><button class="tool" data-action="zoom" aria-label="Enlarge screenshot">${icon('zoom')}</button></div></div><div class="canvas">${calendar()}<div class="canvas-caption"><span>${tool==='blur'?'Blur tool selected · demo screenshot':tool==='arrow'?'Arrow tool selected · demo screenshot':tool==='box'?'Box tool selected · demo screenshot':'Captured from Calendar'}</span><span>1440 × 900 &nbsp;·&nbsp; 100%</span></div></div><div class="copy"><div class="eyebrow">STEP ${String(selected+1).padStart(2,'0')} OF 05</div><h2 contenteditable="${!preview}" role="textbox" aria-label="Step title">${steps[selected][0]}</h2><p contenteditable="${!preview}" role="textbox" aria-label="Step description">${steps[selected][1]}</p><div class="copy-bottom ${preview?'hide':''}"><button class="btn" data-action="rewrite">${icon('spark')} Improve wording</button><span>Click any text to edit</span></div></div><div class="privacy">${icon('shield')} No sensitive information detected <button data-action="privacy">Review</button></div></div><div class="filmstrip">${steps.map((s,i)=>`<button class="frame ${selected===i?'active':''}" data-step="${i}"><div class="mini">${String(i+1).padStart(2,'0')}</div>${s[0]}</button>`).join('')}<button class="frame" data-action="add"><div class="mini">+</div>Add step</button></div><div class="footer"><button data-action="prev">${icon('back')} Previous step</button><button class="next" data-action="next">Next step ${icon('next')}</button></div></main></div>`}
function library(){return `<main class="library"><div class="eyebrow">YOUR PERSONAL PLAYBOOK</div><h1>A little less explaining.<br>A little more doing.</h1><p class="muted">Everything you know how to do, in one place.</p><input type="search" id="search" placeholder="Search your guides…" aria-label="Search guides"><div id="guides">${['Share a calendar event','Set up a new workspace','Office floor plan'].map((s,i)=>`<div class="guide-row" data-title="${s.toLowerCase()}"><div><h3>${s}</h3><p>${i===2?'Annotation guide · 2 pages':'Step-by-step guide · '+(i===0?'5':'8')+' steps'} &nbsp;·&nbsp; Updated today</p></div><button class="btn" data-action="${i===0?'open':'sample'}">Open ${icon('next')}</button></div>`).join('')}</div><button class="btn primary" style="margin-top:28px" data-action="record"><span class="dot"></span> Record a new guide</button></main>`}
let toastTimer;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hide'),3200)}
function changeVariant(v){variant=v;try{let u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u)}catch{}render();console.log('Prototype state',JSON.stringify({variant,page,selectedStep:selected+1,preview}))}
function showModal(html){modal.innerHTML=html;modal.showModal()}
function action(a){if(a==='library'){page='library';render()}else if(a==='open'){page='editor';render()}else if(a==='sample'){toast('Sample library item. Open “Share a calendar event” to explore the editor.')}else if(a==='next'||a==='prev'){selected=(selected+(a==='next'?1:4))%5;render()}else if(a==='preview'){preview=!preview;render()}else if(a==='add'){showModal(`<h2>Add to your guide</h2><p>Choose what comes next.</p><div class="format-grid"><button data-action="insert">New step</button><button data-action="insert">Section</button><button data-action="insert">Note</button><button data-action="insert">Image</button></div><button class="btn" data-action="close">Cancel</button>`)}else if(a==='insert'){modal.close();toast('Insertion flow previewed — sample guide unchanged.')}else if(a==='privacy'){showModal(`<h2>A second look.</h2><p>No email addresses, passwords, or account numbers were detected in this sample screenshot.</p><p>You can hide something yourself with the Blur tool. Your guides stay on your Mac.</p><div class="dialog-actions"><button class="btn" data-action="close">Done</button><button class="btn primary" data-action="blur">Select blur tool</button></div>`)}else if(a==='blur'){tool='blur';modal.close();render()}else if(a==='zoom'){showModal(`<h2>Screenshot</h2><div style="margin:20px 0">${calendar()}</div><button class="btn" data-action="close">Close</button>`)}else if(a==='rewrite'){showModal(`<h2>Make it clearer.</h2><p>Choose a writing style for this step.</p><div class="format-grid">${['More concise','For beginners','For experts','Step by step'].map(s=>`<button data-rewrite="${s}">${s}</button>`).join('')}</div><p>Mockup only · no AI request is sent.</p><button class="btn" data-action="close">Cancel</button>`)}else if(a==='export'){format='PDF';showModal(`<h2>Ready to pass it on?</h2><p>Share a calendar event<br>5 steps · All changes saved</p><div class="format-grid">${['PDF','Word','Markdown','HTML'].map(s=>`<button class="${s===format?'chosen':''}" data-format="${s}">${s}</button>`).join('')}</div><div class="dialog-actions"><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="download">${icon('export')} Export sample</button></div><p style="font-size:10px">Downloads a sample guide in the chosen format.</p>`)}else if(a==='download'){download()}else if(a==='record'){seconds=0;paused=false;showModal(`<div class="eyebrow">RECORDING PREVIEW</div><h2 style="margin-top:10px">Show how it’s done.</h2><p>This is a simulated recording. Your screen is not being captured.</p><div class="record-orb">●</div><div class="timer" id="timer">00:00</div><div class="dialog-actions"><button class="btn" data-action="pause">Pause</button><button class="btn primary" data-action="stop">Stop recording</button></div>`);clearInterval(timer);timer=setInterval(()=>{if(!paused){seconds++;let t=document.getElementById('timer');if(t)t.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}},1000)}else if(a==='pause'){paused=!paused;modal.querySelector('[data-action="pause"]').textContent=paused?'Resume':'Pause'}else if(a==='stop'){clearInterval(timer);modal.close();toast('Recording preview finished. No screen content was captured.')}else if(a==='close'){clearInterval(timer);modal.close()}}
function download(){if(format==='PDF'||format==='Word'){toast(format+' layout preview — production export is not connected.');return}let content=format==='Markdown'?'# Share a calendar event\n\n'+steps.map((s,i)=>`## ${i+1}. ${s[0]}\n\n${s[1]}`).join('\n\n'):`<!doctype html><html lang="en"><meta charset="utf-8"><title>Share a calendar event</title><body style="font:16px system-ui;max-width:700px;margin:60px auto;padding:20px"><h1>Share a calendar event</h1>${steps.map((s,i)=>`<h2>${i+1}. ${s[0]}</h2><p>${s[1]}</p>`).join('')}</body></html>`;let url=URL.createObjectURL(new Blob([content],{type:format==='Markdown'?'text/markdown':'text/html'}));let link=document.createElement('a');link.href=url;link.download='calendar-guide-sample.'+(format==='Markdown'?'md':'html');link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);modal.close();toast('Sample guide exported')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.variant)changeVariant(b.dataset.variant);else if(b.dataset.cycle)changeVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+Number(b.dataset.cycle)+3)%3]);else if(b.dataset.step!==undefined){selected=Number(b.dataset.step);render()}else if(b.dataset.tool){tool=b.dataset.tool;render();if(tool!=='cursor')toast('Tool selection preview — annotation drawing is not connected.')}else if(b.dataset.action)action(b.dataset.action);else if(b.dataset.format){format=b.dataset.format;modal.querySelectorAll('[data-format]').forEach(x=>x.classList.toggle('chosen',x.dataset.format===format))}else if(b.dataset.rewrite){modal.close();toast('“'+b.dataset.rewrite+'” style selected. AI rewriting is simulated.')}});
document.addEventListener('keydown',e=>{if(modal.open||e.target.closest('input,textarea,[contenteditable="true"]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();changeVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+(e.key==='ArrowRight'?1:2))%3])}});
document.addEventListener('input',e=>{if(e.target.id==='search')document.querySelectorAll('[data-title]').forEach(r=>r.classList.toggle('hide',!r.dataset.title.includes(e.target.value.toLowerCase())));if(e.target.matches('[contenteditable]')){let key=e.target.getAttribute('aria-label')==='Step title'?0:1;steps[selected][key]=e.target.textContent}});modal.addEventListener('close',()=>clearInterval(timer));render();console.log('Prototype state',JSON.stringify({variant,page,selectedStep:selected+1,preview}));
</script></body></html>
