[package]
name = "guiderecorder-app"
description = "GuideRecorder desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "guiderecorder-app"

[lib]
name = "guiderecorder_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
guiderecorder-core.workspace = true
guiderecorder-capture.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# PDF pages for annotated guides (`src/pdf.rs`); the capture crate uses the
# same versions.
[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
