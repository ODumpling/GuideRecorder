[package]
name = "guiderecorder-app"
description = "GuideRecorder desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "guiderecorder-app"

[lib]
name = "guiderecorder_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
guiderecorder-core.workspace = true
guiderecorder-capture.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
