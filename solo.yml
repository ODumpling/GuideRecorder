name: GuideRecorder
icon: app/src-tauri/icons/128x128.png

# Everyday commands. None auto-start; run them from Solo.
processes:
  "App":
    # Your real library (Settings, or ~/Documents/GuideRecorder).
    command: pnpm tauri dev
    working_dir: app
    auto_start: false

  "App (sample guides)":
    # A throwaway copy of fixtures/guides in target/sample-library.
    command: "mkdir -p target && { [ -d target/sample-library ] || cp -R fixtures/guides target/sample-library; } && cd app && GUIDERECORDER_LIBRARY=\"$PWD/../target/sample-library\" pnpm tauri dev"
    auto_start: false

  "App (signed bundle)":
    # Builds a debug .app signed with "GuideRecorder Local Dev" and starts it as
    # the app itself, so Screen Recording and Accessibility grants belong to
    # GuideRecorder and survive rebuilds (see docs/signing.md). Runs until the app
    # quits. Needs `scripts/macos-signing.sh create` once.
    command: "set -e; scripts/macos-signing.sh status; (cd app && pnpm tauri build --debug --bundles app); open -W target/debug/bundle/macos/GuideRecorder.app"
    auto_start: false

  "Reset sample guides":
    command: "rm -rf target/sample-library && mkdir -p target && cp -R fixtures/guides target/sample-library && echo 'sample guides reset'"
    auto_start: false

  "Test: all":
    # Everything CI would run: Rust tests + lint, frontend tests, build, e2e.
    command: "set -e; cargo test --workspace; cargo clippy --workspace --all-targets -- -D warnings; cargo fmt --all --check; cd app; pnpm test; pnpm build; pnpm e2e; echo; echo 'ALL TESTS PASSED'"
    auto_start: false

  "Test: Rust":
    command: cargo test --workspace
    auto_start: false

  "Test: frontend":
    command: "set -e; pnpm test; pnpm e2e"
    working_dir: app
    auto_start: false

  "Web":
    # Starts Postgres and storage (web/compose.yaml), migrates, runs the Vite dev server.
    # Needs web/.env.local (copy web/.env.example).
    command: "set -e; docker compose up -d --wait postgres storage; docker compose up storage-setup; pnpm db:migrate; pnpm dev"
    working_dir: web
    auto_start: false

  "Test: web":
    command: "set -e; pnpm --filter @guiderecorder/guide-schema test; pnpm --filter @guiderecorder/web typecheck; pnpm --filter @guiderecorder/web test"
    auto_start: false

  "Install dependencies":
    command: "set -e; pnpm install && cd app && pnpm exec playwright install chromium"
    auto_start: false
