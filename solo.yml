name: GuidesYa
icon: app/src-tauri/icons/128x128.png

# Everyday commands. None auto-start; run them from Solo.
processes:
  "App":
    # Your real library (Settings, or ~/Documents/GuidesYa).
    command: pnpm tauri dev
    working_dir: app
    auto_start: false

  "App (sample guides)":
    # A throwaway copy of fixtures/guides in target/sample-library.
    command: "mkdir -p target && { [ -d target/sample-library ] || cp -R fixtures/guides target/sample-library; } && cd app && GUIDESYA_LIBRARY=\"$PWD/../target/sample-library\" pnpm tauri dev"
    auto_start: false

  "Reset sample guides":
    command: "rm -rf target/sample-library && mkdir -p target && cp -R fixtures/guides target/sample-library && echo 'sample guides reset'"
    auto_start: false

  "Test: all":
    # Everything CI would run: Rust tests + lint, frontend tests, build, e2e.
    command: "set -e; cargo test --workspace; cargo clippy --workspace --all-targets -- -D warnings; cargo fmt --all --check; cd app; pnpm test; pnpm build; pnpm e2e; echo; echo 'ALL TESTS PASSED'"
    auto_start: false

  "Test: Rust":
    command: cargo test --workspace
    auto_start: false

  "Test: frontend":
    command: "set -e; pnpm test; pnpm e2e"
    working_dir: app
    auto_start: false

  "Install dependencies":
    command: "set -e; cd app && pnpm install && pnpm exec playwright install chromium"
    auto_start: false
