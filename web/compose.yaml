# Local services for the web app: `docker compose up -d`, then
# `pnpm db:migrate` and `pnpm dev`. Matches .env.example.
# One fixed name so every worktree shares the same services and ports.
name: guiderecorder-web

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: guiderecorder
      POSTGRES_PASSWORD: guiderecorder
      POSTGRES_DB: guiderecorder
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]

  # S3-compatible storage (RustFS). Console: http://localhost:9001
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: guiderecorder
      RUSTFS_SECRET_KEY: guiderecorder
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [storage:/data]

  # Creates the bucket once storage is up.
  storage-setup:
    image: amazon/aws-cli:latest
    depends_on: [storage]
    environment:
      AWS_ACCESS_KEY_ID: guiderecorder
      AWS_SECRET_ACCESS_KEY: guiderecorder
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until aws --endpoint-url http://storage:9000 s3api head-bucket --bucket guiderecorder 2>/dev/null ||
        aws --endpoint-url http://storage:9000 s3 mb s3://guiderecorder; do sleep 1; done

  # Makes PDF, DOCX, Markdown and HTML downloads with the Rust CLI. Builds
  # the CLI, so it's opt-in: `docker compose --profile worker up -d --build`.
  # Or run `pnpm worker` with GUIDERECORDER_CLI pointing at a local build.
  export-worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: web/worker/Dockerfile
    depends_on: [postgres, storage]
    environment:
      DATABASE_URL: postgres://guiderecorder:guiderecorder@postgres:5432/guiderecorder
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: guiderecorder
      S3_ACCESS_KEY_ID: guiderecorder
      S3_SECRET_ACCESS_KEY: guiderecorder
    restart: unless-stopped

volumes:
  postgres:
  storage:
