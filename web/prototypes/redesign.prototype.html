<!doctype html>
<!-- Throwaway UI study: three GuideRecorder web app directions (A app shell, B editorial, C bold dashboard); switch via ?variant=A|B|C (and &page=landing|dashboard|library|guide|review), the floating switcher, or ← / →. Open this file directly. Sample data only; no backend, network or persistence. Every element maps to a shadcn/ui primitive (Button, Card, Badge, Table, Tabs, DropdownMenu, Dialog, Input, Avatar, Sidebar, Separator) + Tailwind. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GuideRecorder web — Design exploration</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:"Inter Variable",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--primary);color:var(--pfg);padding:8px 12px;border-radius:6px}.skip:focus{top:8px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
h1,h2,h3,p{margin:0}h1:focus{outline:none}
.muted{color:var(--mfg)}.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}.hide{display:none!important}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- shadcn-style primitives (new-york) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:calc(var(--r) - 2px);font-size:14px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background .15s,opacity .15s,box-shadow .15s;text-decoration:none}
.btn-sm{height:32px;padding:0 12px;font-size:13px;gap:6px}.btn-xs{height:26px;padding:0 8px;font-size:12px;gap:4px}.btn-lg{height:44px;padding:0 24px;font-size:15px}.btn-icon{width:36px;padding:0}.btn-sm.btn-icon{width:32px}
.btn-primary{background:var(--primary);color:var(--pfg);box-shadow:0 1px 2px rgb(0 0 0/.1)}.btn-primary:hover{opacity:.9}
.btn-brand{background:var(--brand);color:var(--bfg,#fff);box-shadow:0 1px 2px rgb(0 0 0/.1)}.btn-brand:hover{opacity:.9}
.btn-outline{border-color:var(--border);background:var(--card);box-shadow:0 1px 2px rgb(0 0 0/.04)}.btn-outline:hover{background:var(--hover)}
.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgb(0 0 0/.04)}
.card-h{padding:16px 20px 0}.card-h h2{font-size:15px;font-weight:600}.card-b{padding:16px 20px 20px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.badge-outline{border-color:var(--border);color:var(--mfg)}
.st-draft{background:var(--muted);color:var(--mfg)}
.st-inReview{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}
.st-published{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.st-needsUpdate{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.st-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.input,.select,.textarea{width:100%;height:36px;border:1px solid var(--input);border-radius:calc(var(--r) - 2px);background:var(--card);padding:0 12px;font-size:14px;box-shadow:0 1px 2px rgb(0 0 0/.04)}
.textarea{height:auto;min-height:80px;padding:8px 12px;resize:vertical}
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.tabs{display:inline-flex;gap:2px;background:var(--muted);padding:3px;border-radius:var(--r);max-width:100%;overflow-x:auto}
.tab{height:28px;padding:0 10px;border-radius:calc(var(--r) - 3px);font-size:13px;font-weight:500;color:var(--mfg);white-space:nowrap}
.tab[aria-selected=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.1)}
.tbl-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{height:36px;padding:0 12px;text-align:left;font-weight:500;color:var(--mfg);white-space:nowrap}
.table td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:middle}
.table tbody tr:hover{background:color-mix(in srgb,var(--hover) 60%,transparent)}
.link{font-weight:500;text-decoration:none;text-align:left}.link:hover{text-decoration:underline;text-underline-offset:3px}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:.02em}
.avatar-lg{width:36px;height:36px;font-size:13px}
.stack{display:flex}.stack .avatar{box-shadow:0 0 0 2px var(--card);margin-left:-6px}.stack .avatar:first-child{margin-left:0}
.sep{height:1px;background:var(--border);border:0;margin:0}
.kbd{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--border);background:var(--muted);border-radius:4px;padding:3px 5px;color:var(--mfg)}
.progress{height:6px;border-radius:99px;background:var(--muted);overflow:hidden}.progress>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.menu{position:absolute;z-index:60;min-width:240px;background:var(--pop);color:var(--fg);border:1px solid var(--border);border-radius:var(--r);padding:4px;box-shadow:0 12px 32px rgb(0 0 0/.16)}
.menu-label{padding:6px 8px;font-size:12px;font-weight:500;color:var(--mfg)}
.menu-item{display:flex;width:100%;align-items:center;gap:8px;padding:7px 8px;border-radius:calc(var(--r) - 4px);font-size:13px}
.menu-item:hover,.menu-item:focus-visible{background:var(--hover);outline:none}
.dlg{border:1px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--fg);padding:24px;width:min(460px,calc(100vw - 32px));box-shadow:0 24px 60px rgb(0 0 0/.25)}
.dlg::backdrop{background:rgb(0 0 0/.5)}.dlg h2{font-size:18px;font-weight:600;margin-bottom:4px}.dlg p{font-size:14px;color:var(--mfg)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.field{margin-top:14px}
.toast{position:fixed;right:16px;bottom:76px;z-index:90;background:var(--pop);color:var(--fg);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;font-size:14px;box-shadow:0 12px 32px rgb(0 0 0/.18);max-width:min(380px,calc(100vw - 32px))}
.note{display:flex;gap:10px;border-radius:var(--r);padding:12px 14px;font-size:14px;border:1px solid var(--border)}
.note.tip{background:color-mix(in srgb,var(--info) 8%,var(--card))}.note.warning{background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.note b{font-weight:600}

/* ---------- fake app screenshots (always a light SaaS app) ---------- */
.shot{container-type:inline-size;border-radius:10px;overflow:hidden;border:1px solid #d9dde3;background:#fff;color:#111827;box-shadow:0 8px 24px rgb(15 23 42/.08);width:100%}
.shot-bar{display:flex;align-items:center;gap:6px;height:max(18px,4.2cqi);padding:0 2.2cqi;background:#eef0f3;border-bottom:1px solid #dfe2e7}
.shot-bar i{width:max(6px,1.3cqi);height:max(6px,1.3cqi);border-radius:50%;background:#f87171}.shot-bar i:nth-child(2){background:#fbbf24}.shot-bar i:nth-child(3){background:#34d399}
.shot-bar span{margin-left:2cqi;flex:1;max-width:55%;height:62%;border-radius:4px;background:#fff;font-size:max(7px,1.5cqi);display:flex;align-items:center;padding:0 1.4cqi;color:#6b7280;white-space:nowrap;overflow:hidden}
.shot-body{position:relative;aspect-ratio:16/9;display:grid;grid-template-columns:18% 1fr;font-size:max(6px,1.55cqi)}
.s-side{background:#1e293b;padding:2.4cqi 1.6cqi;display:flex;flex-direction:column;gap:1.4cqi}
.s-side b{display:block;height:1.6cqi;border-radius:2px;background:#475569}.s-side b.on{background:#60a5fa}.s-side b:first-child{background:#e2e8f0;width:70%;margin-bottom:1.2cqi}
.s-main{padding:2.6cqi 3cqi;display:flex;flex-direction:column;gap:1.6cqi;position:relative;background:#f8fafc}
.sk{display:block;height:1.4cqi;border-radius:2px;background:#e2e8f0}.sk.d{background:#cbd5e1}.sk.t{height:2.2cqi;background:#334155;width:38%}
.s-card{background:#fff;border:1px solid #e5e7eb;border-radius:1cqi;padding:1.8cqi;display:flex;flex-direction:column;gap:1.2cqi}
.s-in{height:3.6cqi;border:1px solid #cbd5e1;border-radius:.8cqi;background:#fff;display:flex;align-items:center;padding:0 1.2cqi;color:#334155;white-space:nowrap;overflow:hidden}
.s-btn{height:3.6cqi;border-radius:.8cqi;background:#2563eb;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 2cqi;font-weight:600;white-space:nowrap}
.s-btn.o{background:#fff;color:#334155;border:1px solid #cbd5e1}.s-btn.r{background:#dc2626}
.s-tr{display:grid;grid-template-columns:4% 30% 34% 1fr;gap:1.4cqi;align-items:center;padding:1.2cqi 1.4cqi;border-bottom:1px solid #eef0f3}
.s-tr.on{background:#dbeafe}.s-dotc{width:2.2cqi;height:2.2cqi;border-radius:50%;background:#94a3b8}
.s-veil{position:absolute;inset:0;background:rgb(15 23 42/.45);display:grid;place-items:center}
.s-modal{width:46%;background:#fff;border-radius:1.2cqi;padding:2.4cqi;display:flex;flex-direction:column;gap:1.4cqi;box-shadow:0 2cqi 5cqi rgb(0 0 0/.3)}
.s-toast{position:absolute;right:3cqi;top:3cqi;background:#065f46;color:#fff;border-radius:1cqi;padding:1.4cqi 2cqi;display:flex;gap:1.4cqi;align-items:center;font-weight:600}
.hot{position:absolute;width:7cqi;height:7cqi;margin:-3.5cqi 0 0 -3.5cqi;border-radius:50%;border:max(2px,.45cqi) solid #f43f5e;box-shadow:0 0 0 .9cqi rgb(244 63 94/.22);display:grid;place-items:center;pointer-events:none}
.hot span{position:absolute;right:-1.2cqi;top:-1.2cqi;width:3cqi;height:3cqi;min-width:12px;min-height:12px;border-radius:50%;background:#f43f5e;color:#fff;font-size:max(7px,1.6cqi);font-weight:700;display:grid;place-items:center}

/* ---------- floating switcher ---------- */
.switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:#111;color:#fff;box-shadow:0 10px 30px rgb(0 0 0/.3);font:500 12px/1 Inter,system-ui,sans-serif;max-width:calc(100vw - 16px)}
.switcher button{height:30px;padding:0 12px;border-radius:999px;white-space:nowrap;color:#d4d4d8}.switcher button:hover{background:#262626}
.switcher button[aria-pressed=true]{background:#fff;color:#111}.switcher .arrow{width:30px;padding:0;font-size:16px}
.switcher .study{padding:0 8px;color:#a1a1aa;font-size:10px;letter-spacing:.12em}
.switcher :focus-visible{outline:2px solid #60a5fa;outline-offset:1px}
.switch-space{height:64px}

/* =================== A · Linear-style app shell =================== */
.vA{--bg:#fbfbfc;--fg:#18181b;--card:#fff;--pop:#fff;--muted:#f4f4f5;--mfg:#71717a;--border:#e7e7ea;--input:#e4e4e7;--hover:#f2f2f4;--primary:#18181b;--pfg:#fff;--brand:#2563eb;--ring:#2563eb;--r:8px;--info:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#dc2626;font-size:13px}
.a-shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.a-side{position:sticky;top:0;height:100vh;background:#f6f6f7;border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.a-ws{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;font-weight:600;font-size:13px}.a-ws:hover{background:var(--hover)}
.a-logo{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.a-cmd{display:flex;align-items:center;gap:8px;width:100%;height:32px;margin:6px 0 10px;padding:0 8px;border:1px solid var(--border);background:#fff;border-radius:6px;color:var(--mfg);font-size:13px}.a-cmd .kbd{margin-left:auto}
.a-label{font-size:11px;font-weight:500;color:var(--mfg);padding:12px 8px 4px}
.a-nav{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:6px;color:#52525b;font-size:13px;font-weight:450}
.a-nav:hover{background:var(--hover);color:var(--fg)}.a-nav[aria-current=page]{background:#e9e9ec;color:var(--fg);font-weight:550}
.a-nav .count{margin-left:auto;font-size:11px;color:var(--mfg)}
.a-me{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--border);font-size:12px}
.a-top{position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);background:rgb(251 251 252/.9);backdrop-filter:blur(8px)}
.a-crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mfg);min-width:0;white-space:nowrap;overflow:hidden}.a-crumb b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.a-menu-btn{display:none}
.a-content{padding:20px 24px 40px;max-width:1240px}
.a-h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.a-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r);background:#fff;margin:16px 0}
.a-stats>div{padding:12px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:6px}.a-stats>div:first-child{border-left:0}
.a-stats dt{font-size:12px;color:var(--mfg)}.a-stats dd{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}.a-stats dd small{font-size:12px;font-weight:450;color:var(--mfg)}
.a-two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.a-sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}.a-sec-h h2{font-size:13px;font-weight:600}
.a-feed li{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--border);font-size:12.5px}.a-feed li:first-child{border-top:0}.a-feed{list-style:none;margin:0;padding:0}
.a-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.a-search{position:relative;width:260px;max-width:100%}.a-search .i{position:absolute;left:10px;top:10px;color:var(--mfg)}.a-search .input{padding-left:32px;height:34px;font-size:13px}
.a-guide{display:grid;grid-template-columns:220px minmax(0,1fr) 240px;min-height:calc(100vh - 48px)}
.a-steps{border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.a-step{display:flex;gap:8px;align-items:flex-start;width:100%;padding:7px 8px;border-radius:6px;font-size:12.5px;color:#52525b}
.a-step b{font-weight:500;color:var(--mfg);font-size:11px;min-width:16px;padding-top:1px}.a-step:hover{background:var(--hover)}.a-step[aria-current=step]{background:#e9e9ec;color:var(--fg)}
.a-stage{padding:20px 28px;min-width:0}
.a-props{border-left:1px solid var(--border);padding:16px;font-size:12.5px}
.a-props dl{display:grid;grid-template-columns:84px 1fr;gap:10px 8px;margin:12px 0 0}.a-props dt{color:var(--mfg)}.a-props dd{margin:0}
.a-land-top{height:60px;display:flex;align-items:center;gap:24px;padding:0 max(24px,calc(50% - 560px));border-bottom:1px solid var(--border)}
.a-land-top nav{display:flex;gap:20px;font-size:13px;color:var(--mfg)}
.a-hero{max-width:1120px;margin:0 auto;padding:72px 24px 40px}
.a-hero h1{font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.035em;font-weight:650;max-width:760px}
.a-hero p{font-size:17px;color:var(--mfg);max-width:560px;margin:18px 0 26px}
.a-mock{margin-top:48px;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 30px 80px rgb(0 0 0/.08);display:grid;grid-template-columns:180px 1fr;overflow:hidden;height:330px}
.a-mock aside{background:#f6f6f7;border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:8px}
.a-mock .sk{height:8px;background:#e4e4e7}
.a-features{max-width:1120px;margin:0 auto;padding:24px 24px 64px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-block:1px solid var(--border)}
.a-features>div{background:var(--bg);padding:24px}.a-features h3{font-size:14px;font-weight:600;margin:12px 0 6px}.a-features p{color:var(--mfg)}
.a-price{max-width:1120px;margin:0 auto;padding:48px 24px 40px}
.a-overlay{display:none}
@media (max-width:1100px){.a-guide{grid-template-columns:200px minmax(0,1fr)}.a-props{display:none}}
@media (max-width:860px){.a-two{grid-template-columns:1fr}.a-stats{grid-template-columns:repeat(2,1fr)}.a-stats>div:nth-child(3){border-left:0}.a-stats>div:nth-child(n+3){border-top:1px solid var(--border)}.a-features{grid-template-columns:1fr}}
@media (max-width:760px){.a-shell{grid-template-columns:1fr}.a-side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:70;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgb(0 0 0/.2)}.a-shell.open .a-side{transform:none}.a-shell.open .a-overlay{display:block;position:fixed;inset:0;background:rgb(0 0 0/.3);z-index:65}.a-menu-btn{display:inline-flex}
.a-guide{grid-template-columns:1fr}.a-steps{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border)}.a-step{width:auto;white-space:nowrap}.a-stage{padding:16px}.a-content{padding:16px}.a-land-top nav{display:none}.a-mock{grid-template-columns:1fr}.a-mock aside{display:none}}
@media (max-width:600px){.hide-sm{display:none}}
@media (max-width:480px){.a-land-top{gap:8px;padding:0 12px}.a-land-top .btn-ghost{display:none}.a-stats dd{font-size:16px}.a-top .hide-xs{display:none}.a-hero{padding-top:44px}.a-search{width:100%}}

/* =================== B · Editorial / document =================== */
.vB{--bg:#f5f3ee;--fg:#1d1c1a;--card:#fffdf8;--pop:#fffdf8;--muted:#ece9e2;--mfg:#6f6b64;--border:#e0dbd0;--input:#d6d0c4;--hover:#ece9e2;--primary:#1d1c1a;--pfg:#fffdf8;--brand:#d4462b;--ring:#d4462b;--r:6px;--info:#2b5fb3;--ok:#2f7a51;--warn:#9a6409;--bad:#b42f1d;font-size:16px}
.vB .serif,.vB h1,.vB .b-h2{font-family:"Instrument Serif","New York",ui-serif,Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.005em}
.vB .card{box-shadow:none}
.b-top{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:20px 32px;border-bottom:1px solid var(--fg)}
.b-mast{font-family:"Instrument Serif",Georgia,serif;font-size:26px;text-decoration:none;white-space:nowrap}
.b-nav{display:flex;gap:22px;font-size:14px;overflow-x:auto;scrollbar-width:none}
.b-nav button{padding:4px 0;color:var(--mfg);border-bottom:1px solid transparent;white-space:nowrap}.b-nav button:hover{color:var(--fg)}.b-nav button[aria-current=page]{color:var(--fg);border-color:var(--brand)}
.b-ws{position:relative;margin-left:auto}
.b-col{max-width:700px;margin:0 auto;padding:64px 24px 120px}.b-wide{max-width:1120px;margin:0 auto;padding:64px 32px 120px}
.b-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);font-weight:600}
.b-h1{font-size:clamp(42px,7vw,68px);line-height:1;margin:14px 0 18px}
.b-h2{font-size:32px;line-height:1.1;margin:0 0 6px}
.b-lead{font-size:20px;line-height:1.55;color:#4a4740}

function reviewData(){const g=G('g2');return {g,items:[{k:'changed',t:'Step 3 · Enter the refund amount',old:'Type the full charge amount.',neu:'Type the amount to refund. It can be less than the charge.'},{k:'added',t:'Step 5 · Choose a reason',neu:'Pick “Requested by customer” or “Duplicate” so finance can reconcile it.'},{k:'changed',t:'Screenshot · Step 6',old:'Old confirmation dialog',neu:'New dialog showing the partial amount'},{k:'same',t:'Steps 1, 2, 4, 7, 8',neu:'Unchanged'}]}}

 <main id="main">${S.page==='dashboard'?bDash():S.page==='library'?bLib():S.page==='guide'?bGuide():S.page==='review'?`<div class="b-col"><div class="b-kicker">Review</div><h1 class="b-h1" tabindex="-1" style="font-size:clamp(36px,6vw,52px)">${G('g2').title}</h1>${reviewBody()}</div>`:bMembers()}</main>`}
function bDash(){const w=ws();return `<div class="b-col" style="max-width:820px"><div class="b-kicker">${w.plan} workspace</div><h1 class="b-h1" tabindex="-1">${esc(w.name)}</h1><p class="b-lead">You’re the <em>${w.role}</em> here. ${w.members} of ${w.seats} seats are taken and ${fmtGB(w.storage)} of ${fmtGB(w.cap)} is in use. ${pending().length?`<a href="#waiting" style="color:var(--brand)">${pending().length} changes</a> are waiting for approval.`:''}</p>

function bEntry(g){return `<li><div class="b-meta" style="margin-bottom:6px">${badge(g.status)}<span>${g.folder}</span>${reviewBadge(g)}</div><button class="b-entry-t" ${go('guide',g.id)}>${g.title}</button><p style="margin:6px 0 8px;color:#4a4740;font-size:16px">${g.summary}</p><div class="b-meta"><span>${g.owner}</span><span>${g.steps} steps</span><span>Updated ${g.updated}</span>${g.tags.map(t=>`<span>#${t}</span>`).join('')}</div></li>`}
function bLib(){const list=filtered();const st=[['all','Everything'],...Object.entries(LABEL)];return `<div class="b-col" style="max-width:820px"><div class="b-kicker">${esc(ws().name)}</div><h1 class="b-h1" tabindex="-1">The library</h1><p class="b-lead">${GUIDES.length} guides, written by the people who do the work.</p>

 <div class="row between wrap" style="gap:12px"><div class="b-filters" role="group" aria-label="Status">${st.map(([k,l])=>`<button aria-pressed="${S.status===k}" data-status="${k}">${l}</button>`).join('')}</div>${folderSelect('fB')}</div>

function bGuide(){const g=G(S.guide);return `<div class="b-article"><nav class="b-toc" aria-label="Contents"><span class="b-kicker" style="color:var(--mfg);margin-bottom:6px">Contents</span>${STEPS.map((s,i)=>`<button data-jump="b-s${i}">${i+1}. ${s.t}</button>`).join('')}</nav>

 <div class="row wrap between" style="margin-top:22px;padding:14px 0;border-block:1px solid var(--border);gap:12px"><div class="row">${av(g.owner,'avatar-lg')}<span style="font-size:14px"><b style="font-weight:600">${g.owner}</b><br><span class="muted">Updated ${g.updated} · ${LABEL[g.status]}${g.due?` · review by ${g.due}`:''}</span></span></div><div class="row" style="position:relative"><button class="btn btn-outline btn-sm" data-action="share">${ic('link',14)} Share</button><button class="btn btn-outline btn-sm" data-menu="export" aria-haspopup="menu" aria-expanded="${S.menu==='export'}">Export ${ic('down',14)}</button>${exportMenu('right:0;top:38px')}</div></div>

 ${STEPS.map((s,i)=>`<section class="b-step" id="b-s${i}" aria-labelledby="b-h${i}"><span class="b-num" aria-hidden="true">${i+1}</span><div><h2 id="b-h${i}"><span class="sr-only">Step ${i+1}: </span>${s.t}</h2><p>${s.d}</p>${s.note?`<div style="margin-top:16px">${stepNote(s.note)}</div>`:''}</div><figure>${stepShot(i)}<figcaption>Fig. ${i+1} — ${s.url}</figcaption></figure></section>`).join('')}
 <hr class="b-rule ink" style="margin-top:72px"><p class="serif" style="font-size:28px;text-align:center">You have reached the end of this guide.</p><p class="muted" style="text-align:center;margin-top:8px;font-size:14px">Was it clear? <button class="link" style="color:var(--brand)" data-toast="Thanks. Feedback is simulated.">Yes</button> · <button class="link" style="color:var(--brand)" data-toast="Thanks. Feedback is simulated.">Something’s off</button></p></article><div></div></div>`}
function bMembers(){const w=ws();return `<div class="b-col"><div class="b-kicker">${w.members} of ${w.seats} seats</div><h1 class="b-h1" tabindex="-1">Members</h1><ul class="b-list" style="margin-top:28px">${members().map(m=>`<li class="row" style="gap:14px">${av(m[0],'avatar-lg')}<span class="grow"><span class="serif" style="font-size:22px">${m[0]}</span><br><span class="muted" style="font-size:14px">${m[1]}</span></span><span class="b-kicker" style="color:var(--mfg)">${m[2]}</span></li>`).join('')}</ul><button class="btn btn-primary" style="margin-top:24px" data-action="invite">Invite someone</button></div>`}

 <main id="main"><section class="b-hero"><div><div class="b-kicker">The team handbook, written by doing</div><h1 tabindex="-1" style="margin-top:18px">Your guides, <em>shared</em>.</h1></div><div><p class="b-lead">Sync guides from the GuideRecorder app, share them with a link, and keep your team’s library reviewed and current.</p><div class="row wrap" style="margin-top:24px"><button class="btn btn-brand btn-lg" ${go('dashboard')}>Get started</button><button class="btn btn-outline btn-lg" ${go('guide','g1')}>Read a guide</button></div></div></section>
 <section class="b-essays" id="b-why">${[['I.','Record once','Do the task as you normally would. The app captures each click as a step, with a screenshot and words you can edit.'],['II.','Review before it’s gospel','Approvers sign off changes by folder, so the library only ever says what’s true. Every version is kept.'],['III.','Read it anywhere','Share a link with a customer, a contractor or the whole company. It reads like a page, not a slideshow.']].map(e=>`<div><span class="b-kicker">${e[0]}</span><h3>${e[1]}</h3><p>${e[2]}</p></div>`).join('')}</section>
 <section class="b-sample" id="b-ex"><div><div class="b-kicker">From the Northwind library</div><h2 class="b-h2" style="font-size:40px;margin-top:10px">Reset a customer’s password in the Admin Console</h2><p class="b-lead" style="font-size:17px;margin-top:12px">Six steps, two minutes, one fewer ticket escalated.</p><button class="btn btn-ghost" style="padding:0;margin-top:16px;color:var(--brand)" ${go('guide','g1')}>Read the guide ${ic('arrow',14)}</button></div><figure style="margin:0">${stepShot(3)}<figcaption class="muted" style="font-size:13px;font-style:italic;margin-top:10px">Step 4 — Choose Reset password</figcaption></figure></section></main>`}

function C(){
 if(S.page==='landing')return cLanding();
 const w=ws();const n=(p,i,l)=>`<button ${go(p)} ${cur(p)}>${ic(i,15)}${l}</button>`;
 return `<header class="c-top"><button class="c-logo" ${go('landing')} aria-label="GuideRecorder home">${ic('logo',18)}</button><nav class="c-nav" aria-label="Main">${n('dashboard','home','Home')}${n('library','book','Guides')}${n('review','inbox','Reviews')}${n('members','users','Team')}</nav><span class="grow"></span><button class="btn btn-ghost btn-icon" data-action="cmdk" aria-label="Search">${ic('search')}</button><div style="position:relative"><button class="c-wsbtn" data-menu="wsC" aria-haspopup="menu" aria-expanded="${S.menu==='wsC'}"><span class="a-logo" style="background:${w.color};width:28px;height:28px;border-radius:999px">${w.name[0]}</span><span class="c-wsname">${esc(w.name)}</span>${ic('down',14)}</button>${wsMenu('wsC','right:0;top:48px')}</div></header>
 <main id="main" class="c-wrap">${S.page==='dashboard'?cDash():S.page==='library'?cLib():S.page==='guide'?cGuide():S.page==='review'?`<div style="max-width:820px;margin:0 auto"><h1 class="c-hello" style="font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.04em;display:block" tabindex="-1">${G('g2').title}</h1>${reviewBody({primary:'btn-grad'})}</div>`:cMembers()}</main>`}
function ring(p,size=64){const r=size/2-6,c=2*Math.PI*r;return `<svg class="c-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${p}% used"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--muted)" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#cg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><defs><linearGradient id="cg"><stop offset="0" stop-color="#6d5cff"/><stop offset="1" stop-color="#ff4fb8"/></linearGradient></defs></svg>`}
function spark(){const w=220,h=48,max=Math.max(...SPARK);const pts=SPARK.map((v,i)=>[i*w/(SPARK.length-1),h-4-(v/max)*(h-8)]);return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Guide views per week, last 12 weeks, up from ${SPARK[0]*100} to ${SPARK.at(-1)*100}"><path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="transparent"><title>Week ${i+1}: ${SPARK[i]*100} views</title></circle>`).join('')}</svg>`}
function cDash(){const w=ws();const pub=GUIDES.filter(g=>g.status==='published').length;return `<div class="c-hello"><div><p class="muted" style="font-weight:600">${w.plan} plan · you’re ${w.role}</p><h1 tabindex="-1">Morning, Maya.<br><span class="c-gt">${pending().length?pending().length+' guides need you.':'All caught up.'}</span></h1></div><div class="row wrap"><button class="btn btn-outline" data-action="invite">${ic('plus')} Invite</button><button class="btn btn-grad" ${go('library')}>${ic('book')} Open library</button></div></div>
 <div class="c-grid"><section class="c-tile grad" aria-labelledby="t1"><h2 id="t1">${ic('eye',15)} Views this week</h2><div class="c-big tabnum">1,200</div><p class="muted" style="font-size:13px">+9% vs last week</p>${spark()}</section>
 <section class="c-tile" aria-labelledby="t2"><h2 id="t2">${ic('users',15)} Seats</h2>${ring(pct(w.members,w.seats))}<div class="c-big tabnum">${w.members}<small> / ${w.seats}</small></div><p class="muted" style="font-size:13px">${w.seats-w.members} left${w.seats-w.members<=1?` · <button class="link" style="color:var(--ring)" data-action="upgrade">Upgrade</button>`:''}</p></section>
 <section class="c-tile" aria-labelledby="t3"><h2 id="t3">${ic('db',15)} Storage</h2><div class="c-big tabnum">${w.storage}<small> GB</small></div><div class="progress" style="height:10px" role="progressbar" aria-label="Storage used" aria-valuenow="${pct(w.storage,w.cap)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct(w.storage,w.cap)}%;background:var(--grad)"></i></div><p class="muted" style="font-size:13px">${pct(w.storage,w.cap)}% of ${fmtGB(w.cap)}</p></section>
 <section class="c-tile" aria-labelledby="t4"><h2 id="t4">${ic('sync',15)} Synced guides</h2><div class="c-big tabnum">${GUIDES.length}</div><div class="row wrap" style="gap:6px">${badge('published').replace(LABEL.published,pub+' live')}<span class="badge st-inReview">${GUIDES.filter(g=>g.status==='inReview').length} in review</span></div></section>
 <section class="card c-span7" style="padding:20px" aria-labelledby="c-ap"><div class="row between" style="margin-bottom:14px"><h2 id="c-ap" style="font-size:18px;font-weight:750">Approval queue</h2><button class="btn btn-ghost btn-sm" ${go('review')}>See all ${ic('right',14)}</button></div>${w.approvals?`<div class="c-list">${pending().map(a=>`<div class="c-item">${av(a.who,'avatar-lg')}<div class="grow"><button class="link" style="font-weight:650" ${go('review')}>${G(a.g).title}</button><div class="muted" style="font-size:13px">${a.what} · ${a.when}</div></div><span class="badge badge-outline tabnum hide-sm">${a.have}/${a.need}</span><button class="btn btn-primary btn-sm" ${go('review')}>Review</button></div>`).join('')}</div>`:noApprovals()}</section>
 <section class="card c-span5" style="padding:20px" aria-labelledby="c-tm"><div class="row between" style="margin-bottom:14px"><h2 id="c-tm" style="font-size:18px;font-weight:750">Team</h2><button class="btn btn-ghost btn-sm" ${go('members')}>Manage ${ic('right',14)}</button></div><div class="stack" style="margin-bottom:16px">${members().map(m=>av(m[0],'avatar-lg')).join('')}</div><div class="c-list">${AUDIT.slice(0,3).map(e=>`<div class="row" style="font-size:13px;gap:10px">${ic('bolt',14)}<span class="grow"><b style="font-weight:600">${e[0]}</b> <span class="muted">${e[1]}</span> ${e[2]}</span><span class="muted" style="white-space:nowrap">${e[3]}</span></div>`).join('')}</div></section>

function cCard(g){return `<button class="c-gcard" ${go('guide',g.id)}>${thumb(g)}<span class="row between" style="padding:0 4px">${badge(g.status)}<span class="muted tabnum" style="font-size:12px">${g.steps} steps</span></span><span style="padding:0 4px 4px;font-weight:700;font-size:15px;line-height:1.3">${g.title}</span><span class="row muted" style="padding:0 4px 6px;font-size:12px">${av(g.owner)}${g.owner} · ${g.updated}</span></button>`}

function cGuide(){const g=G(S.guide),s=STEPS[S.step];return `<div class="row wrap between" style="margin:12px 0 18px;gap:12px"><div><button class="btn btn-ghost btn-sm" style="padding:0 8px 0 0" ${go('library')}>${ic('left',14)} Guides</button><h1 tabindex="-1" style="font-size:clamp(24px,3.6vw,36px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:6px">${g.title}</h1><div class="row wrap" style="margin-top:8px">${badge(g.status)}${reviewBadge(g)}<span class="muted" style="font-size:13px">${g.folder} · ${g.owner} · ${g.views} views</span></div></div><div class="row" style="position:relative"><button class="btn btn-outline btn-sm" data-action="share">${ic('link',14)} Share</button><button class="btn btn-outline btn-sm" data-menu="export" aria-haspopup="menu" aria-expanded="${S.menu==='export'}">Export ${ic('down',14)}</button>${exportMenu('right:0;top:40px')}</div></div>
 <div class="c-seg" role="group" aria-label="Steps" style="margin-bottom:16px">${STEPS.map((x,i)=>`<button data-step="${i}" class="${i<S.step?'done':''}" ${i===S.step?'aria-current="step"':''} aria-label="Step ${i+1}: ${esc(x.t)}"></button>`).join('')}</div>
 <div class="c-viewer"><div class="card" style="padding:14px;background:linear-gradient(160deg,#1d1b3a,#14141f)">${stepShot(S.step)}</div>
 <section class="card c-stepcard" style="padding:24px" aria-live="polite"><span class="badge" style="background:var(--grad);color:#fff">Step ${S.step+1} of ${STEPS.length}</span><h2 style="font-size:24px;font-weight:800;letter-spacing:-.03em;margin:14px 0 8px;line-height:1.15">${s.t}</h2><p style="color:#cfcde3;font-size:15px;line-height:1.6">${s.d}</p>${s.note?`<div style="margin-top:14px">${stepNote(s.note)}</div>`:''}${S.step===0?`<div class="c-item" style="margin-top:14px;display:block;font-size:13px"><b>Before you start</b><ul style="margin:6px 0 0;padding-left:18px;color:var(--mfg)">${PREREQ.map(p=>`<li>${p}</li>`).join('')}</ul></div>`:''}
 <div class="row" style="margin-top:22px"><button class="btn btn-outline" data-action="prev" ${S.step===0?'disabled':''}>${ic('left')} Back</button><span class="grow"></span>${S.step<STEPS.length-1?`<button class="btn btn-grad" data-action="next">Next ${ic('right')}</button>`:`<button class="btn btn-grad" data-action="restart">Done · Restart</button>`}</div>${g.id!=='g1'?'<p class="muted" style="font-size:12px;margin-top:12px">Sample steps shown for every guide.</p>':''}</section></div>
 <div class="c-grid" style="margin-top:16px">${STEPS.map((x,i)=>`<button class="c-gcard c-thumb" style="padding:8px;${i===S.step?'border-color:#a78bfa':''}" data-step="${i}" aria-label="Go to step ${i+1}: ${esc(x.t)}">${shot(x.k,null,0,'',x.t)}<span style="font-size:12px;font-weight:650;padding:0 2px"><span class="muted">${i+1}</span> ${x.t}</span></button>`).join('')}</div>`}
function cMembers(){const w=ws();return `<div class="c-hello"><h1 tabindex="-1">Team <span class="c-gt tabnum">${w.members}/${w.seats}</span></h1><button class="btn btn-grad" data-action="invite">${ic('plus')} Invite</button></div><div class="c-grid">${members().map(m=>`<div class="card c-span4" style="padding:18px;display:flex;gap:12px;align-items:center">${av(m[0],'avatar-lg')}<span class="grow"><b>${m[0]}</b><br><span class="muted" style="font-size:13px">${m[1]}</span></span><span class="badge ${m[2]==='owner'||m[2]==='admin'?'st-inReview':'badge-outline'}">${m[2]}</span></div>`).join('')}</div>`}
function cLanding(){return `<div class="c-land"><div class="c-glow"></div><header class="c-top" style="position:relative"><span class="c-logo">${ic('logo',18)}</span><b style="font-size:16px">GuideRecorder</b><span class="grow"></span><button class="btn btn-ghost btn-sm" ${go('dashboard')}>Sign in</button><button class="btn btn-primary btn-sm" ${go('dashboard')}>Get started</button></header>
 <main id="main"><section class="c-hero"><span class="badge badge-outline" style="background:rgb(255 255 255/.06)">${ic('spark',12)} Approvals + version history are live</span><h1 tabindex="-1" style="margin-top:20px">Record once.<br><span class="c-gt">Share everywhere.</span></h1><p>Sync guides from the GuideRecorder app, share them with a link, and keep your team’s library reviewed and current.</p><div class="row wrap" style="justify-content:center"><button class="btn btn-grad btn-lg" ${go('dashboard')}>Start free ${ic('arrow')}</button><button class="btn btn-outline btn-lg" ${go('guide','g1')}>${ic('play',14)} Watch a walkthrough</button></div>
 <div class="c-floats"><div class="card" style="padding:14px;transform:perspective(1200px) rotateX(8deg)">${stepShot(4)}</div><div class="c-fbadge" style="left:-30px;top:30%">${ic('check')} Approved by Priya</div><div class="c-fbadge" style="right:-30px;top:60%"><span class="c-gt" style="font-size:22px;font-weight:800">6</span> steps · 2 min</div></div></section>
 <section class="c-wrap"><div class="c-grid">${[['bolt','Sync in seconds','Flip sync on in the app. Screenshots, steps and notes land here.'],['shield','Approvals by folder','Nothing goes live until an approver says yes.'],['link','Links that behave','Public, password or members-only. Revoke any time.'],['users','SSO & SCIM','Okta, Entra or any SAML / OIDC provider on Enterprise.']].map((f,i)=>`<div class="c-tile ${i===0?'grad':''}"><span class="c-logo" style="${i===0?'background:rgb(255 255 255/.2)':''}">${ic(f[0],18)}</span><h2 style="font-size:18px;color:inherit;margin-top:auto">${f[1]}</h2><p class="muted">${f[2]}</p></div>`).join('')}
 ${[['Free','$0','1 seat · 1 GB · public links'],['Pro','$12','per seat / mo · 10 GB · approvals'],['Enterprise','Talk to us','SSO, SCIM, audit forever']].map((p,i)=>`<div class="card c-span4" style="padding:24px;${i===1?'border:2px solid #b44dff':''}"><div class="row between"><b style="font-size:18px">${p[0]}</b>${i===1?'<span class="badge" style="background:var(--grad);color:#fff">Popular</span>':''}</div><div class="c-big" style="font-size:40px;margin:18px 0 6px">${p[1]}</div><p class="muted">${p[2]}</p><button class="btn ${i===1?'btn-grad':'btn-outline'}" style="width:100%;margin-top:18px" ${go('dashboard')}>Choose ${p[0]}</button></div>`).join('')}</div></section></main></div>`}

/* ---------------- render / events ---------------- */
const root=document.getElementById('root'),dlg=document.getElementById('dlg');
let lastPage=S.page;
function render(){const a=document.activeElement,id=a&&a.id,sel=a&&a.selectionStart;
 document.body.className='v'+S.variant;
 root.innerHTML=S.variant==='A'?A():S.variant==='B'?B():C();
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===S.variant));
 if(id&&document.getElementById(id)){const e=document.getElementById(id);e.focus();if(sel!=null&&e.setSelectionRange)try{e.setSelectionRange(sel,sel)}catch{}}
 else if(lastPage!==S.page){const h=root.querySelector('h1[tabindex]');if(h)h.focus({preventScroll:true});window.scrollTo(0,0)}
 lastPage=S.page;
 try{const u=new URL(location.href);u.searchParams.set('variant',S.variant);u.searchParams.set('page',S.page);history.replaceState({},'',u)}catch{}}
function setVariant(v){S.variant=v;S.menu=null;S.nav=false;render()}
function cycle(d){const o=['A','B','C'];setVariant(o[(o.indexOf(S.variant)+d+3)%3])}
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hide'),3200)}
function openDlg(html){dlg.innerHTML=html;dlg.showModal();const f=dlg.querySelector('input,select,textarea');if(f)f.focus()}
function invite(){const w=ws(),left=w.seats-w.members;openDlg(`<h2 id="dlg-title">Invite to ${esc(w.name)}</h2><p>${left>0?`${left} ${left===1?'seat':'seats'} left on ${w.plan}.`:'No seats left. Upgrade to invite more people.'}</p><form method="dialog" data-form="invite"><div class="field"><label class="label" for="inv-e">Email</label><input class="input" id="inv-e" type="email" required placeholder="name@company.com"></div><div class="field"><label class="label" for="inv-r">Role</label><select class="select" id="inv-r">${ROLES.map(r=>`<option ${r==='editor'?'selected':''}>${r}</option>`).join('')}</select></div><div class="dlg-actions"><button class="btn btn-outline" value="cancel" formnovalidate>Cancel</button><button class="btn ${S.variant==='C'?'btn-grad':'btn-primary'}" value="ok" ${left>0?'':'disabled'}>Send invite</button></div></form>`)}
function cmdk(){openDlg(`<h2 id="dlg-title" class="sr-only">Command menu</h2><label class="sr-only" for="ck">Search pages and guides</label><input class="input" id="ck" placeholder="Type a command or search…" autocomplete="off"><div id="ck-list" role="listbox" aria-label="Results" style="margin-top:8px;max-height:320px;overflow:auto"></div><p style="font-size:12px;margin-top:8px">↵ to open · Esc to close</p>`);dlg.style.padding='12px';fillCmd('')}
function fillCmd(q){const items=[['Go to Overview','dashboard'],['Go to Library','library'],['Go to Approvals','review'],['Go to Members','members'],['Marketing site','landing'],...GUIDES.map(g=>[g.title,'guide',g.id])].filter(i=>i[0].toLowerCase().includes(q.toLowerCase()));document.getElementById('ck-list').innerHTML=items.map(i=>`<button class="menu-item" role="option" ${go(i[1],i[2])}>${ic(i[1]==='guide'?'book':'arrow',14)} ${i[0]}</button>`).join('')||'<p style="padding:8px">No results.</p>'}
const ACT={nav:()=>{S.nav=!S.nav;render()},closenav:()=>{S.nav=false;render()},invite,cmdk,clear:()=>{S.q='';S.status='all';S.folder='all';render()},prev:()=>{S.step=Math.max(0,S.step-1);render()},next:()=>{S.step=Math.min(STEPS.length-1,S.step+1);render()},restart:()=>{S.step=0;render()},
 upgrade:()=>openDlg(`<h2 id="dlg-title">Upgrade ${esc(ws().name)}</h2><p>Pro adds approvals, password share links, 25 seats and 10 GB. Billing is simulated here.</p><div class="dlg-actions"><button class="btn btn-outline" data-action="close">Not now</button><button class="btn ${S.variant==='C'?'btn-grad':'btn-primary'}" data-toast="Checkout previewed. No payment taken." data-close>Upgrade to Pro</button></div>`),
 share:()=>openDlg(`<h2 id="dlg-title">Share link</h2><p>Who can open this guide with the link?</p><div class="field"><label class="label" for="sh-a">Access</label><select class="select" id="sh-a"><option>Only signed-in members</option><option>Anyone with the link</option><option>Only with a password</option></select></div><div class="field"><label class="label" for="sh-u">Link</label><input class="input" id="sh-u" readonly value="https://guides.northwind.co/s/k3J9-qT2"></div><div class="dlg-actions"><button class="btn btn-outline" data-action="close">Close</button><button class="btn ${S.variant==='C'?'btn-grad':'btn-primary'}" data-toast="Link copied (prototype)." data-close>${ic('link',14)} Copy link</button></div>`),
 newws:()=>{S.menu=null;render();toast('Creating workspaces is out of scope for this study.')},close:()=>dlg.close()};
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');
 if(S.menu&&!(b&&b.dataset.menu)&&!e.target.closest('.menu')){S.menu=null;if(!b){render();return}}
 if(!b)return;const d=b.dataset;
 if(d.variant)return setVariant(d.variant);if(d.cycle)return cycle(+d.cycle);
 if(d.go){if(dlg.open)dlg.close();S.page=d.go;if(d.id){S.guide=d.id;S.step=0}S.menu=null;S.nav=false;return render()}
 if(d.menu){S.menu=S.menu===d.menu?null:d.menu;render();const m=root.querySelector('.menu .menu-item');if(m)m.focus();return}
 if(d.ws){S.ws=d.ws;S.menu=null;render();return toast('Switched to '+ws().name)}
 if(d.status){S.status=d.status;return render()}
 if(d.folder){S.folder=S.folder===d.folder&&S.variant==='C'?'all':d.folder;if(S.page!=='library'){S.page='library';S.nav=false}return render()}
 if(d.step){S.step=+d.step;return render()}
 if(d.mode){S.mode=d.mode;return render()}
 if(d.jump){const t=document.getElementById(d.jump);if(t){t.scrollIntoView({behavior:'smooth'});t.setAttribute('tabindex','-1');t.focus({preventScroll:true})}return}
 if(d.toast){if(d.close!==undefined||b.closest('.menu')){dlg.open&&d.close!==undefined&&dlg.close();S.menu=null;render()}return toast(d.toast)}
 if(d.action&&ACT[d.action])ACT[d.action]()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='ck')return fillCmd(t.value);if(t.dataset.bind==='q'){S.q=t.value;render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.bind==='folder'){S.folder=t.value;render()}if(t.dataset.role)toast(`Role of ${t.dataset.role} set to ${t.value} (prototype).`)});
dlg.addEventListener('submit',e=>{if(e.target.dataset.form==='invite'&&e.submitter&&e.submitter.value==='ok')setTimeout(()=>toast('Invitation previewed. Nothing was sent.'))});
dlg.addEventListener('close',()=>{dlg.style.padding=''});
dlg.addEventListener('keydown',e=>{if(e.target.id==='ck'&&e.key==='Enter'){const f=dlg.querySelector('[data-go]');if(f)f.click()}});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dlg.open)cmdk();return}
 if(e.key==='Escape'&&(S.menu||S.nav)){S.menu=null;S.nav=false;render();return}
 if(dlg.open||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});
render();
</script></body></html>
